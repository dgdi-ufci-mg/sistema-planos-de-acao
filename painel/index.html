<!doctype html>
<!-- Painel público de um Plano de Ação ou Projeto (18/11/2026; documentação técnica, seção 8.8): painel/?p=<código>.
     Fica fora das pastas sextante/ e strata/ para não fazer parte de nenhum dos dois aplicativos instaláveis.
     Desde 19/11/2026 (pedido do responsável), com a identidade visual da UFCIMG e sem o nome do sistema: a paleta é
     sempre a da UFCIMG (data-paleta fixo), e o modo claro ou escuro segue o aparelho, sem a escolha guardada no Sextante. -->
<html lang="pt-BR" data-paleta="ufcimg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel público</title>
<link rel="icon" type="image/svg+xml" href="marca/ufcimg-simbolo.svg">
<!-- a barra do navegador no celular acompanha o cabeçalho, marinho da marca nos dois modos -->
<meta name="theme-color" content="#142C46">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="preload" href="fontes/metropolis-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontes/metropolis-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body class="painel-publico">
<header class="pp-topo">
  <div class="pp-topo-linha">
    <img class="pp-marca" src="marca/ufcimg-sigla-negativa.svg" alt="UFCIMG" width="122" height="34">
    <span class="pp-selo">Painel público · somente leitura</span>
  </div>
</header>
<main class="pp-conteudo" id="painel" aria-live="polite">
  <div class="esqueleto esqueleto-lista" role="status" aria-label="Carregando"><span class="esqueleto-cartao linha"><span class="esqueleto-bloco grosso" style="width:60%"></span></span><span class="esqueleto-cartao linha"><span class="esqueleto-bloco grosso" style="width:45%"></span></span></div>
</main>
<footer class="pp-fim">
  <div class="pp-fim-linha">
    <img src="marca/ufcimg-horizontal-negativa.svg" alt="UFCIMG, Universidade Federal de Ciência e Inovação de Minas Gerais" width="210" height="72">
  </div>
</footer>
<script type="module" src="../js/painel.js"></script>
</body>
</html>
