<!doctype html>
<!-- O Sextante saiu da raiz e foi para a pasta sextante/ (27/10/2026), ao lado do Strata (strata/), para cada um ser
     um aplicativo instalável à parte: o Chrome trata como parte de um aplicativo tudo o que fica dentro do endereço
     dele, e o Sextante na raiz englobava o Strata. Esta página leva ao novo endereço, mantendo o que vier depois
     do ? e do #. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sextante</title>
<script>location.replace("sextante/" + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=sextante/"></noscript>
</head>
<body>
<p>O Sextante mudou de endereço. <a href="sextante/">Abrir o Sextante</a>.</p>
</body>
</html>
