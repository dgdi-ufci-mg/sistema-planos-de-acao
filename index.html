<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sextante</title>
<link rel="icon" type="image/png" href="logo.png">
<!-- aplicativo instalável pelo navegador (seção 8, "Instalar como aplicativo") -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sextante">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<!-- botão do menu lateral fora da barra do topo, para ficar junto do menu (22/10/2026) -->
<button class="botao-lateral" type="button" data-alternar-lateral aria-label="Menu" aria-controls="lateral" aria-expanded="true">
  <!-- computador: ícone de barra lateral (como no Jira, no Todoist e no Planner); celular: as três linhas da gaveta -->
  <svg class="icone icone-lateral-pc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
  <svg class="icone icone-lateral-cel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
<header class="topo">
  <div class="topo-linha">
    <h1 class="topo-titulo" data-titulo></h1>
    <div class="topo-acoes" data-acoes-topo></div>
  </div>
  <p class="aviso-conexao" data-sem-conexao role="status" hidden><b>Sem conexão.</b> As alterações não serão gravadas até a internet voltar.</p>
</header>
<aside class="lateral" id="lateral" aria-label="Menu"></aside>
<div class="fundo-lateral" hidden></div>

<nav class="barra-inferior" aria-label="Navegação"></nav>
<main class="conteudo">
  <div id="principal"><div class="esqueleto esqueleto-lista" role="status" aria-label="Carregando"><span class="esqueleto-cartao linha"><span class="esqueleto-bloco grosso" style="width:60%"></span></span><span class="esqueleto-cartao linha"><span class="esqueleto-bloco grosso" style="width:45%"></span></span><span class="esqueleto-cartao linha"><span class="esqueleto-bloco grosso" style="width:52%"></span></span></div></div>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
