<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sextante (versão 2, em construção)</title>
<style>
:root{--bg:#F6F4EF;--surface:#FFFFFF;--ink:#163F3A;--muted:#5E6B68;--line:#E2DDD3;--accent:#00796B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--surface:#1A201F;--ink:#E6ECEA;--muted:#9AA7A4;--line:#2C3533;--accent:#4DB6AC}}
:root[data-theme="dark"]{--bg:#121615;--surface:#1A201F;--ink:#E6ECEA;--muted:#9AA7A4;--line:#2C3533;--accent:#4DB6AC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;text-align:center}
img{width:56px;height:56px}
h1{margin:12px 0 4px;font-size:1.6rem}
p{margin:8px 0;color:var(--muted)}
a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
  <img src="../logo.png" alt="">
  <h1>Sextante</h1>
  <p>Versão 2 do sistema, em construção. Esta página será substituída passo a passo, conforme a especificação.</p>
  <p>O sistema em uso continua no endereço de sempre: <a href="../">abrir o sistema em uso</a>.</p>
</main>
</body>
</html>
