    </div>
    <p class="note">O código da simulação garante que o mesmo plano gere sempre o mesmo resultado; mude-o só se quiser outro conjunto de sorteios. A forma "mais cautelosa" sorteia prazos longos com mais frequência; a "mais otimista" sorteia mais perto da estimativa mais provável. Mais simulações dão resultados mais estáveis, mas demoram um pouco mais.</p>
    ${S.canWrite?`<div class="row">${conf?`<button class="btn danger" data-act="delProj">Excluir “${esc(P.name||"")}” e todas as ações</button><button class="btn" data-act="cancel">Cancelar</button>`:`<button class="btn danger" data-act="askDelProj">Excluir plano</button>`}</div>`:""}`;
}

/* ---------- ações ---------- */
async function newProject(example){
  const pid=Store.newId();
  const base={name:example?"Exemplo: implantação de sistema":"Novo plano",start:todayISO(),createdAt:new Date().toISOString(),dist:"tri",iters:3000,seed:20261014,holidays:""};
  if(example){const t=parseISO(todayISO());base.target=iso(addD(t,77))}
  const ok=await W(()=>Store.setProject(pid,base));if(!ok)return;
  S.pid=pid;lsSet("cc.pid",pid);
  if(example){
    const ex=[["INI","Abertura e termo do projeto","",1,2,3,4000],["LEV","Levantamento de requisitos","INI",5,8,14,12000],["ARQ","Desenho da arquitetura","LEV",3,5,10,9000],
      ["AQS","Aquisição de licenças","LEV",10,15,30,35000],["DEV","Desenvolvimento","ARQ",15,20,35,60000],["INT","Integração com sistemas legados","ARQ",8,12,25,22000],
      ["TES","Testes integrados","DEV, INT, AQS",5,7,12,15000],["CAP","Capacitação de usuários","ARQ",4,5,8,8000],["IMP","Implantação","TES, CAP",2,3,6,6000],["ENC","Encerramento","IMP",1,1,2,2000]];
    let k=0;for(const[id,name,pr,o,m,p,c]of ex){await W(()=>Store.setTask(pid,id,{name,preds:splitPreds(pr),o,m,p,cost:c,owners:[],order:++k}))}
  }else{S.settingsOpen=true}
  selectProject(pid);if(!example)S.tab="tarefas";renderAll();
}
async function addTask(){
  let code=$("#newCode").value.trim();const desc=$("#newDesc").value.trim(),label=$("#newName").value.trim(),stage=$("#newStage").value.trim();const name=label||desc;
  if(!name){toast("Descreva a ação ou informe pelo menos o rótulo.");$("#newDesc").focus();return}
  if(!code)code=genCode(name,takenCodes());
  if(!ID_RE.test(code)){toast("O código deve ter só letras, números, _ ou - (ex.: LEV). Ou deixe em branco para o sistema criar.");$("#newCode").focus();return}
  if(S.tasks.some(t=>t.id===code)){toast(`Já existe uma ação com o código ${code}. Escolha outro.`);return}
  const ord=Math.max(0,...S.tasks.map(t=>t.order||0))+1;
  const pkNew=$('.pk[data-kind="pred"][data-pk="__new"]'),pkOwn=$('.pk[data-kind="own"][data-pk="__new"]');
  const d={name,desc:label&&desc&&desc!==label?desc:"",stage,preds:pkNew?pkVals(pkNew):[],owners:pkOwn?pkVals(pkOwn):[],o:num($("#newO").value),m:num($("#newM").value),p:num($("#newP").value),order:ord};
  if(await W(()=>Store.setTask(S.pid,code,d))){toast(`Ação ${code} adicionada.`);const h=$("#codeHint");if(h)h.textContent="";["newCode","newName","newDesc","newO","newM","newP"].forEach(i=>$("#"+i).value="");for(const el of[pkNew,pkOwn])if(el){el.dataset.val="";el.innerHTML=pkHTML(el.dataset.kind,"__new",[],false)}$("#newCode").focus()}
}
async function doImport(){
  const imp=S.imp;if(!imp)return;const ex=new Map(S.tasks.map(t=>[t.id,t]));let ord=Math.max(0,...S.tasks.map(t=>t.order||0));let n=0;
  for(const r of imp.rows){const{id,owner,...f}=r;
    if(owner!=null){const ids=[];for(const nm of String(owner).split(/[,;\/]+| e (?=[A-ZÀ-Ú])/).map(x=>x.trim()).filter(Boolean)){
      const hit=S.people.find(x=>normKey(x.name)===normKey(nm)||(x.sigla&&normKey(x.sigla)===normKey(nm)));const pid=hit?hit.id:await createPerson(nm,"","");if(pid)ids.push(pid)}f.owners=ids}
    if(ex.has(id)){if(await W(()=>Store.updateTask(S.pid,id,f)))n++}
    else{const d={name:"",preds:[],owners:[],...f,order:++ord};if(await W(()=>Store.setTask(S.pid,id,d)))n++}}
  S.imp=null;toast(`${n} ações importadas.`);S.tab="tarefas";lsSet("cc.tab",S.tab);renderAll();
}
async function saveBaseline(){
  const r=S.res;if(!r||!r.det)return;const useCost=r.useCost;const tasks={};
  r.net.list.forEach((t,i)=>{tasks[t.id]={es:r.det.ES[i],ef:r.det.EF[i],v:taskValue(t,r.E[i],useCost)}});
  S.confirm=null;
  if(await W(()=>Store.updateProject(S.pid,{baseline:{at:todayISO(),fin:r.det.fin,useCost,tasks}})))toast("Plano original guardado.");
}
const FIELD={name:v=>v.trim(),desc:v=>v.trim(),stage:v=>v.trim(),preds:v=>splitPreds(v),o:num,m:num,p:num,cost:num,ac:num,pct:v=>{const n=num(v);return n==null?null:clamp(n,0,100)},aS:v=>v||"",aF:v=>v||""};

document.addEventListener("click",async e=>{
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;lsSet("cc.tab",S.tab);renderMain();return}
  const ib=e.target.closest("[data-imp]");if(ib){S.impMode=ib.dataset.imp;S.imp=null;renderMain();return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="settings"){S.settingsOpen=!S.settingsOpen;S.confirm=null;renderTop();renderSettings()}
  else if(a==="newproj")newProject(false);
  else if(a==="example")newProject(true);
  else if(a==="askDel"){S.confirm="del:"+b.dataset.id;renderMain()}
  else if(a==="dzoom"){const z=+b.dataset.z,svgEl=$("#diag svg");if(z===0){dZoom=null}else{dZoom=Math.min(2,Math.max(.3,(dZoom||1)*(z>0?1.25:0.8)))}drawDiagram()}
  else if(a==="login"){S.showLogin=true;renderMain()}
  else if(a==="loginClose"){S.showLogin=false;renderAll()}
  else if(a==="forgot")doForgot();
  else if(a==="logout"){try{await S.fb.auth.signOut();toast("Você saiu. Os planos continuam visíveis para consulta.")}catch(e){}}
  else if(a==="backupCopy"){try{const d=await collectAll();const n=Object.keys(d.projects).length;await copyText(JSON.stringify({sistema:"planos-de-acao",versao:1,geradoEm:new Date().toISOString(),...d}));toast(`Cópia de ${n} plano(s) copiada. Cole num arquivo de texto e guarde.`)}catch(e){toast("Não foi possível gerar a cópia: "+(e.message||e))}}
  else if(a==="restoreAsk"){const t=$("#restoreText").value;try{const d=JSON.parse(t);if(!d.projects)throw 0;S.restoreData=d;S.restoreOpen=true;S.confirm="restore";renderMain();const ta=$("#restoreText");if(ta)ta.value=t}catch(e){toast("O texto colado não é uma cópia de segurança válida.")}}
  else if(a==="restoreDo"){S.confirm=null;const d=S.restoreData;S.restoreData=null;const n=await restoreAll(d);S.restoreOpen=false;renderAll();toast(`${n} registros restaurados.`)}
  else if(a==="bulkPreview"){const txt=$("#bulkText").value;S.pimp=parsePeople(txt);renderMain();const ta=$("#bulkText");if(ta)ta.value=txt}
  else if(a==="bulkClear"){S.pimp=null;renderMain()}
  else if(a==="bulkSave")bulkSave();
  else if(a==="askDelPerson"){S.confirm="delp:"+b.dataset.id;renderMain()}
  else if(a==="delPerson"){const id=b.dataset.id;S.confirm=null;if(await W(()=>Store.deletePerson(id)))toast("Responsável excluído.")}
  else if(a==="delTask"){const id=b.dataset.id;S.confirm=null;await W(()=>Store.deleteTask(S.pid,id))}
  else if(a==="askBaseline"){S.confirm="baseline";renderMain()}
  else if(a==="baseline")saveBaseline();
  else if(a==="cancel"){S.confirm=null;renderMain();renderSettings()}
  else if(a==="askDelProj"){S.confirm="delproj";renderSettings()}
  else if(a==="delProj"){const pid=S.pid,ids=S.tasks.map(t=>t.id);S.confirm=null;S.settingsOpen=false;renderSettings();
    if(await W(()=>Store.deleteProject(pid,ids))){S.pid=null;lsSet("cc.pid","");toast("Plano excluído.")}}
  else if(a==="preview"){const txt=$("#impText").value;S.imp=S.impMode==="mermaid"?parseMermaid(txt):parseTable(txt);renderMain();const ta=$("#impText");if(ta)ta.value=txt}
  else if(a==="clearImp"){S.imp=null;renderMain()}
  else if(a==="doImport")doImport();
  else if(a==="copyTSV")copyText(exportTSV());
  else if(a==="copyMermaid")copyText(exportMermaid());
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="newName"||t.id==="newCode"||t.id==="newDesc"){const h=$("#codeHint");if(!h)return;const c=$("#newCode").value.trim(),n=$("#newName").value.trim()||$("#newDesc").value.trim();
  h.textContent=!c&&n?`Se deixar em branco: ${genCode(n,takenCodes())}`:(c&&S.tasks.some(x=>x.id.toUpperCase()===c.toUpperCase())?"Este código já está em uso":"")}});
document.addEventListener("submit",async e=>{if(e.target.id==="addForm"){e.preventDefault();addTask()}
  else if(e.target.id==="loginForm"){e.preventDefault();doLogin()}
  else if(e.target.id==="personForm"){e.preventDefault();const n=$("#newPName").value,sg=$("#newPSigla").value,u=$("#newPUnit").value;
    if(S.people.some(x=>normKey(x.name)===normKey(n))){toast(`“${n.trim()}” já está na lista.`);return}
    if(await createPerson(n,sg,u)){["newPName","newPSigla","newPUnit"].forEach(i=>$("#"+i).value="");$("#newPName").focus();toast("Responsável adicionado.")}}});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="dOwners"){lsSet("cc.downers",t.checked?"1":"0");renderMain();return}
  if(t.id==="linksTgl"){lsSet("cc.links",t.checked?"1":"0");renderMain();return}
  if(t.id==="projSel"){S.settingsOpen=false;renderSettings();selectProject(t.value);return}
  if(t.id==="qStatus"){await W(()=>Store.updateProject(S.pid,{statusDate:t.value||""}));return}
  if(t.dataset.person&&t.dataset.pf){const v=t.value.trim();if(t.dataset.pf==="name"&&!v){toast("O nome não pode ficar vazio.");return}await W(()=>Store.updatePerson(t.dataset.person,{[t.dataset.pf]:v}));return}
  if(t.dataset.p){const k=t.dataset.p;let v=t.value;if(k==="iters"||k==="seed"||k==="nearCrit")v=num(v);if(k==="iters"&&v!=null)v=clamp(Math.round(v),200,20000);
    await W(()=>Store.updateProject(S.pid,{[k]:v}));return}
  if(t.dataset.id&&t.dataset.f&&FIELD[t.dataset.f]){await W(()=>Store.updateTask(S.pid,t.dataset.id,{[t.dataset.f]:FIELD[t.dataset.f](t.value)}))}
});
document.addEventListener("focusout",()=>{setTimeout(()=>{const a=document.activeElement;if(S.deferred&&!(a&&a.closest&&a.closest("[data-live]")))renderAll()},0)});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab==="cronograma")renderMain()},200)});

/* ---------- partida ---------- */
async function boot(){
  renderTop();renderMain();
  let db=null,user=null;
  try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}}catch(e){}
  if(!db&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.projectId){
    try{await loadFirebase();db=S.fb.db}catch(e){console.error(e);toast("Não foi possível conectar ao banco de dados. O sistema abriu sem salvar.")}}
  S.db=db;S.user=user;S.mode=S.fb&&db?"firebase":db?"shared":"local";
  if(S.mode==="firebase"){S.canWrite=!!S.fb.auth.currentUser;S.fb.auth.onAuthStateChanged(u=>{S.fbUser=u;S.canWrite=!!u;renderAll()})}
  if(user&&user.can){try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch(e){}}
  Store.listenProjects(onProjects);
  Store.listenPeople(ps=>{S.peopleLoaded=true;S.people=ps.sort((a,b)=>(a.name||"").localeCompare(b.name||"","pt-BR"));renderAll()});
}
boot();
</script>
