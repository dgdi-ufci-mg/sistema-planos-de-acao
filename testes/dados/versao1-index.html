<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" type="image/png" href="logo.png">
<script src="config.js"></script>
</head>
<body>
<title>Sistema de Gerenciamento de Planos de Ação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de planejamento — barra de projeto com faixa nas três cores principais, indicadores, abas; Gantt em dias úteis */
:root{
  --bg:#F5F3EF; --surface:#FFFFFF; --sunk:#FAF8F5; --ink:#163F3A; --muted:#62706C; --line:#DDD6CC; --grid:#ECE6DD;
  --accent:#00796B; --accent-soft:#D6EEE9; --crit:#E3262D; --crit-soft:#FCE0DF; --crit-ink:#9C1116;
  --ok:#7FB77E; --ok-soft:#E4F1E3; --ok-ink:#3B6E3A; --warn:#F2B04A; --warn-soft:#FEF1D8; --warn-ink:#8A5E10;
  --hist:#F47216; --p80:#9C1116; --base:#B9B0A4; --brand2:#F47216; --brand3:#FBCA78;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px; --lab:250px; --px:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A19; --surface:#172624; --sunk:#132120; --ink:#ECF2F0; --muted:#9FB3AE; --line:#2A3F3C; --grid:#1E302D;
  --accent:#2CC4AA; --accent-soft:#103B35; --crit:#FF4D52; --crit-soft:#3D1618; --crit-ink:#FF8A8D;
  --ok:#8FC68E; --ok-soft:#1B3320; --ok-ink:#A9D6A9; --warn:#FBCA78; --warn-soft:#3A2B12; --warn-ink:#FFD58F;
  --hist:#F68A3A; --p80:#F6836C; --base:#6F827E; --brand2:#F47216; --brand3:#FBCA78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A19; --surface:#172624; --sunk:#132120; --ink:#ECF2F0; --muted:#9FB3AE; --line:#2A3F3C; --grid:#1E302D;
  --accent:#2CC4AA; --accent-soft:#103B35; --crit:#FF4D52; --crit-soft:#3D1618; --crit-ink:#FF8A8D;
  --ok:#8FC68E; --ok-soft:#1B3320; --ok-ink:#A9D6A9; --warn:#FBCA78; --warn-soft:#3A2B12; --warn-ink:#FFD58F;
  --hist:#F68A3A; --p80:#F6836C; --base:#6F827E; --brand2:#F47216; --brand3:#FBCA78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.25rem} h3{font-size:1.05rem}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
.btn.small{padding:3px 8px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 8px;min-width:0}
textarea{width:100%;font-family:var(--f-data);font-size:.85rem}
.f{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
.f>input,.f>select,.f>textarea{color:var(--ink);font-size:.95rem}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:14px 12px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--accent) 0 34%,var(--brand2) 34% 67%,var(--brand3) 67% 100%) 1}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{flex:none;display:block}
.brand h1{font-size:1.4rem;font-weight:700;color:var(--ink)}
.brand small{display:block;font-family:var(--f-body);font-size:.78rem;color:var(--muted);font-weight:400;letter-spacing:0}
.projbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.projbar select{max-width:260px;font-weight:600}
.pill{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok-ink)} .pill.warn{color:var(--warn-ink)} .pill.crit{color:var(--crit-ink)}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.82rem;color:var(--muted)}
.tec{font-size:.72rem;color:var(--muted);font-style:italic;line-height:1.3}
th .tec,.f .tec,.stat .tec{display:block;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gloss div{background:var(--sunk);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gloss h3{font-size:1.05rem}
.gloss p{margin:0;font-size:.92rem;max-width:65ch}
@media (max-width:860px){.gloss{grid-template-columns:minmax(0,1fr)}}
.kpi.crit .v{color:var(--crit-ink)} .kpi.ok .v{color:var(--ok-ink)} .kpi.warn .v{color:var(--warn-ink)}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* abas */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 14px;font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}

/* avisos */
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:0 4px 4px 0;font-size:.88rem}
.alert.err{border-color:var(--crit);background:var(--crit-soft)}

/* gantt */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gantt{position:relative;min-width:100%}
.grow{display:flex;height:44px;border-bottom:1px solid var(--grid)}
.glab{position:sticky;left:0;z-index:5;flex:none;width:var(--lab);background:var(--surface);border-right:1px solid var(--line);padding:4px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.25;overflow:hidden}
.glab b{font-family:var(--f-data);font-size:.78rem;font-weight:500}
.glab span{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glab.crit b{color:var(--crit-ink)}
.gtrack{position:relative;flex:none}
.ghead{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.links{position:absolute;top:0;z-index:1;pointer-events:none;overflow:visible}
.links path.lk{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.75}
.links path.lk.c{stroke:var(--crit);stroke-width:1.6;opacity:1}
.links path.ah{fill:var(--muted)} .links path.ah.c{fill:var(--crit)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.ghead .gtrack{height:44px}
.ghead .glab{justify-content:flex-end}
.mon{position:absolute;top:4px;font-family:var(--f-display);font-weight:600;font-size:.8rem;white-space:nowrap}
.wk{position:absolute;bottom:4px;font-family:var(--f-data);font-size:.7rem;color:var(--muted);white-space:nowrap}
.gbg{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.gbg i{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.gline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed;z-index:3;pointer-events:none}
.gline span{position:absolute;top:2px;left:4px;font-size:.7rem;font-weight:600;white-space:nowrap;background:var(--surface);padding:0 3px;border-radius:3px}
.gline.status{border-color:var(--ink)} .gline.status span{color:var(--ink)}
.gline.target{border-color:var(--warn)} .gline.target span{color:var(--warn-ink)}
.gline.p80{border-color:var(--p80);border-left-style:dotted} .gline.p80 span{color:var(--p80)}
.bar{position:absolute;top:12px;height:16px;border-radius:3px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden;z-index:2}
.bar.crit{background:var(--crit-soft);border-color:var(--crit)}
.bar.done{background:var(--ok-soft);border-color:var(--ok)}
.bar .pg{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.crit .pg{background:var(--crit)} .bar.done .pg{background:var(--ok)}
.bbar{position:absolute;top:31px;height:4px;border-radius:2px;background:var(--base);z-index:2}
.ms{position:absolute;top:14px;width:12px;height:12px;transform:rotate(45deg);background:var(--accent);z-index:2}
.ms.crit{background:var(--crit)}
.ci{position:absolute;top:12px;font-family:var(--f-data);font-size:.7rem;color:var(--muted);white-space:nowrap;z-index:1;line-height:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid}
@media (max-width:640px){:root{--lab:140px;--px:16px}.glab span{font-size:.78rem}}

/* tabelas */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
tr.crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.edit input{width:100%;border-color:transparent;background:transparent;padding:4px 6px}
.edit input:hover{border-color:var(--line)} .edit input:focus{border-color:var(--accent);background:var(--surface)}
.edit input[type=number]{width:70px;text-align:right;font-family:var(--f-data)}
.edit input.w-name{min-width:220px} .edit input.w-pred{min-width:110px;font-family:var(--f-data)}
.edit input[type=date]{width:140px}
.code{font-family:var(--f-data);font-weight:500}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit-ink)} .chip.ok{background:var(--ok-soft);color:var(--ok-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.cibar{display:inline-block;width:70px;height:8px;background:var(--grid);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.cibar i{display:block;height:100%;background:var(--crit)}

/* grades */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.form .wide{grid-column:span 2}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.form{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--sunk);border-radius:4px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.78rem}
.stat.crit b{color:var(--crit-ink)} .stat.ok b{color:var(--ok-ink)} .stat.warn b{color:var(--warn-ink)}
.note{font-size:.85rem;color:var(--muted);max-width:75ch}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-data);font-size:11px}
svg.chart .ax{stroke:var(--line)} svg.chart .gr{stroke:var(--grid)}
svg.chart .hb{fill:var(--hist);opacity:.7} svg.chart .cdf{fill:none;stroke:var(--accent);stroke-width:2}
svg.chart .pv{fill:none;stroke:var(--base);stroke-width:2}
svg.chart .ev{fill:var(--warn);stroke:var(--ink);stroke-width:1} svg.chart .lbl{fill:var(--ink);font-weight:500}
svg.chart .vl{stroke-width:1.5;stroke-dasharray:4 3}
svg.chart .vl.t{stroke:var(--warn)} svg.chart .vl.p{stroke:var(--ink)} svg.chart .vl.c{stroke:var(--crit)}
svg.chart text.t{fill:var(--warn-ink)} svg.chart text.c{fill:var(--crit-ink)}
.empty{text-align:left;padding:28px;gap:14px}
.empty h2{font-size:1.6rem}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:.9rem;z-index:50;max-width:min(560px,calc(100vw - 32px))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--surface)}
/* seletor de dependências */
.pk{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:180px;border:1px solid transparent;border-radius:4px;padding:2px 4px;cursor:text}
.pk:hover{border-color:var(--line)} .pk:focus-within{border-color:var(--accent);background:var(--surface)}
#addForm{align-items:flex-start}
#addForm .f{white-space:nowrap}
#addForm .pk{border-color:var(--line);background:var(--surface);min-height:34px;width:240px;color:var(--ink)}
.tag{display:inline-flex;align-items:center;font-family:var(--f-data);font-size:.78rem;background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:1px 2px 1px 6px;white-space:nowrap}
.tag button{border:0;background:none;color:var(--muted);padding:0 5px;font-size:1rem;line-height:1}
.tag button:hover{color:var(--crit-ink)}
.pk input.pk-in{border:0;background:transparent;flex:1;min-width:70px;width:auto;padding:3px 2px;outline:none;font-size:.85rem}
#pick{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:260px;overflow-y:auto;padding:4px}
#pick .op{display:flex;gap:10px;padding:7px 8px;border-radius:4px;cursor:pointer;font-size:.88rem;align-items:baseline}
#pick .op b{font-family:var(--f-data);font-weight:500;min-width:42px;flex:none}
#pick .op span{min-width:0}
#pick .op[aria-selected=true]{background:var(--accent-soft)}
#pick .none{padding:8px;color:var(--muted);font-size:.85rem}
#pick .op.add b{color:var(--accent)} #pick .op.add span{font-weight:600}
/* diagrama de rede */
.dwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:78vh;-webkit-overflow-scrolling:touch}
#diag{padding:8px;min-height:120px}
#diag svg{display:block}
#diag .nd rect{stroke-width:1.4}
#diag .nd.crit rect{fill:var(--crit-soft);stroke:var(--crit)} #diag .nd.near rect{fill:var(--warn-soft);stroke:var(--warn)}
#diag .nd.norm rect{fill:var(--accent-soft);stroke:var(--accent)} #diag .nd.done rect{fill:var(--ok-soft);stroke:var(--ok)}
#diag .nd text{fill:var(--ink);font-family:var(--f-body);font-size:11.5px}
#diag .nd text .cd{font-family:var(--f-data);font-weight:500}
#diag .nd text.meta{fill:var(--muted);font-size:10.5px}
#diag .nd text.own{fill:var(--muted);font-size:10.5px;font-style:italic}
#diag .ic.done{fill:var(--ok-ink)} #diag .ic.late{fill:var(--crit-ink)} #diag .ic.prog{fill:var(--accent)}
#diag .term circle{fill:var(--ink)} #diag .term text{fill:var(--surface);font-family:var(--f-body);font-size:11.5px;font-weight:600}
#diag .ed{fill:none;stroke:var(--muted);stroke-width:1.2} #diag .ed.c{stroke:var(--crit);stroke-width:2}
#diag .ah{fill:var(--muted)} #diag .ah.c{fill:var(--crit)}
#diag .cl rect{stroke-width:1.2;stroke-dasharray:0}
#diag .cl text{font-family:var(--f-display);font-size:12.5px;font-weight:600;fill:var(--ink)}
.dleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);align-items:center}
.dleg i{display:inline-block;width:16px;height:11px;border-radius:2px;border:1.4px solid;margin-right:5px;vertical-align:-1px}
.dleg b{font-family:var(--f-data);font-weight:500;color:var(--ink);margin-right:4px}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.bar,.bbar{transition:left .2s,width .2s}}
</style>

<div class="wrap">

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace("%","").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:null};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const parseISO=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const addD=(d,n)=>new Date(d.getTime()+n*864e5);
const todayISO=()=>{const t=new Date();return iso(new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())))};
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fdate=d=>d?`${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${String(d.getUTCFullYear()).slice(2)}`:"—";
const f1=x=>x==null||!Number.isFinite(x)?"—":(Math.round(x*10)/10).toLocaleString("pt-BR");
const f2=x=>x==null||!Number.isFinite(x)?"—":x.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pctf=x=>x==null||!Number.isFinite(x)?"—":Math.round(x*100)+"%";
const money=x=>x==null||!Number.isFinite(x)?"—":x.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
function brToISO(s){s=String(s||"").trim();if(!s)return "";if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(!m)return "";let y=+m[3];if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`}
function parseHol(txt){return String(txt||"").split(/[\s,;]+/).map(brToISO).filter(Boolean)}
const splitPreds=s=>Array.isArray(s)?s:String(s||"").split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
const ID_RE=/^[A-Za-z0-9_\-~:@+]{1,40}$/;
const normKey=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();


/* ---------- geração automática de código ---------- */
const STOPW=new Set("a o as os e de da do das dos em no na nos nas para pra por com sem ao aos a as um uma uns umas ou que se sua seu suas seus pelo pela pelos pelas sobre entre ate apos".split(" "));
function codeWords(name){return normKey(name).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w&&!STOPW.has(w))}
function takenCodes(extra){const t=new Set(S.tasks.map(x=>String(x.id).toUpperCase()));if(extra)extra.forEach(x=>t.add(String(x).toUpperCase()));return t}
function randCode(taken){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",L="ABCDEFGHJKLMNPQRSTUVWXYZ";
  for(let i=0;i<2000;i++){let k=L[Math.floor(Math.random()*L.length)];for(let j=0;j<2;j++)k+=A[Math.floor(Math.random()*A.length)];if(!taken.has(k))return k}
  return "A"+Date.now().toString(36).slice(-5).toUpperCase()}
function genCode(name,taken){
  const w=codeWords(name);if(!w.length)return randCode(taken);
  const C=[],cons=x=>x[0]+x.slice(1).replace(/[aeiou]/g,"");
  if(w.length>=3)C.push(w[0][0]+w[1][0]+w[2][0]);
  if(w.length>=2){C.push(w[0][0]+cons(w[1]).slice(0,2),w[0][0]+w[1].slice(0,2),w[0].slice(0,2)+w[1][0])}
  C.push(cons(w[0]).slice(0,3),w[0].slice(0,3));
  for(let i=1;i<w.length;i++)for(const ch of w[i].slice(1))C.push(w[0][0]+w[i][0]+ch);
  for(const ch of w[0].slice(1))C.push(w[0][0]+ch+(w[1]?w[1][0]:w[0].slice(-1)));
  for(const c of C){const k=c.toUpperCase();if(k.length===3&&/^[A-Z]/.test(k)&&!taken.has(k))return k}
  const base=(C[0]||"X").toUpperCase().slice(0,2).padEnd(2,"X");if(/^[A-Z]/.test(base))for(let d=2;d<=9;d++){if(!taken.has(base+d))return base+d}
  return randCode(taken)}
/* ---------- calendário de dias úteis ---------- */
function mkCal(startISO,hol){
  const H=new Set(hol||[]);
  const isW=d=>{const w=d.getUTCDay();return w!==0&&w!==6&&!H.has(iso(d))};
  let d=parseISO(startISO)||parseISO(todayISO()),guard=0;
  while(!isW(d)&&guard++<400)d=addD(d,1);
  const days=[];let cur=d;
  const ext=n=>{let g=0;n=Math.min(n,30000);while(days.length<n&&g++<60000){if(isW(cur))days.push(cur);cur=addD(cur,1)}};
  ext(300);
  const cal={
    d0:days[0],
    date(i){i=Math.max(0,Math.floor(i+1e-9));if(i>=days.length)ext(i+300);return days[Math.min(i,days.length-1)]},
    countBefore(s){const t=parseISO(s);if(!t)return null;if(t<=days[0])return 0;let g=0;while(days[days.length-1]<t&&g++<100)ext(days.length+300);let lo=0,hi=days.length;while(lo<hi){const m=(lo+hi)>>1;if(days[m]<t)lo=m+1;else hi=m}return lo},
    countThrough(s){const t=parseISO(s);return t?cal.countBefore(iso(addD(t,1))):null},
    startD(es){return cal.date(es)},
    finD(ef,es){return cal.date(Math.max(es??0,Math.ceil(ef-1e-9)-1))}
  };
  return cal;
}

/* ---------- estimativas e rede ---------- */
function est(t){
  let o=num(t.o),m=num(t.m),p=num(t.p);
  if(m==null){if(o!=null&&p!=null)m=(o+p)/2;else if(o!=null)m=o;else if(p!=null)m=p}
  if(m==null)return{o:0,m:0,p:0,te:0,sd:0,missing:true};
  if(o==null)o=m;if(p==null)p=m;if(o>m)o=m;if(p<m)p=m;if(o<0)o=0;
  return{o,m,p,te:(o+4*m+p)/6,sd:(p-o)/6,missing:false};
}
function buildNet(tasks){
  const list=[...tasks].sort((a,b)=>(a.order??0)-(b.order??0)||a.id.localeCompare(b.id));
  const pos=new Map(list.map((t,i)=>[t.id,i]));
  const unknown=[];
  const preds=list.map(t=>{const out=new Set();for(const c of splitPreds(t.preds)){if(c===t.id)continue;if(pos.has(c))out.add(pos.get(c));else unknown.push([t.id,c])}return[...out]});
  const succ=list.map(()=>[]);preds.forEach((ps,i)=>ps.forEach(p=>succ[p].push(i)));
  const indeg=preds.map(p=>p.length),topo=[],q=[];indeg.forEach((d,i)=>{if(!d)q.push(i)});
  while(q.length){const i=q.shift();topo.push(i);for(const s of succ[i])if(--indeg[s]===0)q.push(s)}
  const cyc=topo.length<list.length?list.filter((t,i)=>indeg[i]>0).map(t=>t.id):[];
  return{list,pos,preds,succ,topo,unknown,cyc};
}
function mkOut(n){return{ES:new Float64Array(n),EF:new Float64Array(n),LS:new Float64Array(n),LF:new Float64Array(n)}}
/* passada de ida e volta; ctx.tr traz o estado de execução quando há data de status */
function sched(net,dur,ctx,out){
  const{topo,preds,succ}=net,{ES,EF,LS,LF}=out,S=ctx.S,tr=ctx.tr;let fin=0;
  for(const i of topo){
    let es=0;for(const p of preds[i])if(EF[p]>es)es=EF[p];
    const k=tr[i];let ef;
    if(k){
      if(k.st==="done"){if(k.aS!=null)es=k.aS;ef=k.aF!=null?Math.max(k.aF,es):Math.max(es,Math.min(es+dur[i],S))}
      else if(k.st==="prog"){es=k.aS!=null?k.aS:Math.min(es,S);ef=Math.max(S,es)+dur[i]*(1-k.pct)}
      else{if(es<S)es=S;ef=es+dur[i]}
    }else ef=es+dur[i];
    ES[i]=es;EF[i]=ef;if(ef>fin)fin=ef;
  }
  for(let j=topo.length-1;j>=0;j--){const i=topo[j];let lf=fin;for(const s of succ[i])if(LS[s]<lf)lf=LS[s];LF[i]=lf;LS[i]=lf-(EF[i]-ES[i])}
  return fin;
}

/* ---------- aleatoriedade reprodutível ---------- */
function mulberry32(a){a>>>=0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function normal(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function gammaS(a,r){if(a<1)return gammaS(1+a,r)*Math.pow(r(),1/a);const d=a-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=normal(r);v=1+c*x}while(v<=0);v=v*v*v;const u=r();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v}}
function sampleTri(e,r){const{o,m,p}=e;if(p<=o)return m;const u=r(),fc=(m-o)/(p-o);return u<fc?o+Math.sqrt(u*(p-o)*(m-o)):p-Math.sqrt((1-u)*(p-o)*(p-m))}
function sampleBeta(e,r){const{o,m,p}=e;if(p<=o)return m;const a=1+4*(m-o)/(p-o),b=1+4*(p-m)/(p-o);const x=gammaS(a,r),y=gammaS(b,r);return o+(p-o)*x/(x+y)}
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));

/* ---------- cálculo determinístico ---------- */
function computeDet(P,tasks){
  const net=buildNet(tasks),n=net.list.length,res={net,n,errors:[],warns:[]};
  if(!P)return res;
  if(net.cyc.length){res.errors.push(`As ações ${net.cyc.join(", ")} dependem umas das outras em círculo, e assim nenhuma pode começar. Corrija a coluna “Depende de” de uma delas para o cronograma ser calculado.`);return res}
  for(const[a,b]of net.unknown)res.warns.push(`A ação ${a} diz depender de “${b}”, mas não há ação com esse código. Essa dependência foi desconsiderada.`);
  const E=net.list.map(est);res.E=E;
  const miss=net.list.filter((t,i)=>E[i].missing).map(t=>t.id);
  if(miss.length)res.warns.push(`Estas ações ainda não têm prazo estimado e estão contando como zero dias: ${miss.slice(0,12).join(", ")}${miss.length>12?"…":""}. Preencha os prazos na aba Ações.`);
  const cal=mkCal(P.start,parseHol(P.holidays));res.cal=cal;
  const S=P.statusDate?cal.countThrough(P.statusDate):null;const tracking=S!=null&&S>0;res.S=tracking?S:null;
  const tr=net.list.map(t=>{if(!tracking)return null;const pct=clamp(num(t.pct)||0,0,100)/100;const aS=t.aS?cal.countBefore(t.aS):null;const aF=t.aF?cal.countThrough(t.aF):null;
    const st=pct>=1||(aF!=null&&aF<=S)?"done":(pct>0||(aS!=null&&aS<S))?"prog":"todo";return{st,pct:st==="done"?1:pct,aS,aF}});
  res.tr=tr;res.ctx={S:tracking?S:0,tr};
  const dur=Float64Array.from(E,e=>e.te),o=mkOut(n),fin=sched(net,dur,res.ctx,o);
  const fl=new Float64Array(n),crit=new Array(n);
  for(let i=0;i<n;i++){fl[i]=o.LS[i]-o.ES[i];crit[i]=fl[i]<1e-6&&!(tr[i]&&tr[i].st==="done")}
  res.det={...o,fin,fl,crit};
  /* PERT clássico: variância de um caminho crítico (o de maior variância nos empates) */
  let varSum=0,cur=-1,best=-1;
  for(let i=0;i<n;i++)if(crit[i]&&Math.abs(o.EF[i]-fin)<1e-6&&(best<0||E[i].sd>E[best].sd))best=i;
  cur=best;const pathIdx=[];let g=0;
  while(cur>=0&&g++<n+1){pathIdx.push(cur);const k=tr[cur];const rem=k?(k.st==="done"?0:1-k.pct):1;varSum+=Math.pow(E[cur].sd*rem,2);
    let nx=-1;for(const p of net.preds[cur])if(crit[p]&&Math.abs(o.EF[p]-o.ES[cur])<1e-6&&(nx<0||E[p].sd>E[nx].sd))nx=p;cur=nx}
  res.pert={sigma:Math.sqrt(varSum),path:pathIdx.reverse()};
  res.targetIdx=P.target?cal.countThrough(P.target):null;
  if(res.targetIdx!=null){const s=res.pert.sigma;res.pert.pTarget=s>0?Phi((res.targetIdx-fin)/s):(fin<=res.targetIdx+1e-9?1:0)}
  computeEVM(P,res);
  return res;
}
function taskValue(t,e,useCost){return useCost?(num(t.cost)||0):e.te}
function computeEVM(P,res){
  const{net,E,det,tr}=res,B=P.baseline;res.useCost=net.list.some(t=>(num(t.cost)||0)>0);
  if(!B||!B.tasks)return;
  const bt=B.tasks,useCost=!!B.useCost;
  const bes=[],bef=[],bv=[];for(const id in bt){bes.push(bt[id].es);bef.push(bt[id].ef);bv.push(bt[id].v)}
  const BAC=bv.reduce((a,b)=>a+b,0),bfin=B.fin;
  const PV=t=>{let s=0;for(let k=0;k<bv.length;k++){const a=bes[k],b=bef[k];s+=bv[k]*(b>a?clamp((t-a)/(b-a),0,1):(t>=a?1:0))}return s};
  const ev={useCost,BAC,bfin,PV,rows:[]};
  for(let i=0;i<net.list.length;i++){const t=net.list[i],b=bt[t.id];ev.rows.push({i,id:t.id,b,dFin:b?det.EF[i]-b.ef:null,dSt:b?det.ES[i]-b.es:null})}
  if(res.S!=null){
    const S=res.S;let EV=0,AC=0;
    net.list.forEach((t,i)=>{const b=bt[t.id];const v=b?b.v:taskValue(t,E[i],useCost);const pc=tr[i]?tr[i].pct:0;EV+=v*pc;AC+=num(t.ac)||0});
    const pv=PV(S);
    let lo=0,hi=bfin;if(EV>=BAC-1e-9)lo=hi;else for(let k=0;k<60;k++){const m=(lo+hi)/2;if(PV(m)<EV)lo=m;else hi=m}
    const ESt=(lo+hi)/2;
    Object.assign(ev,{S,EV,AC,pv,SV:EV-pv,SPI:pv>0?EV/pv:null,CPI:useCost&&AC>0?EV/AC:null,ESt,SPIt:S>0?ESt/S:null});
    ev.EAC=ev.CPI?BAC/ev.CPI:null;
    ev.IEACt=ev.SPIt&&ev.SPIt>0?bfin/ev.SPIt:null;
  }
  res.evm=ev;
}

/* ---------- Monte Carlo ---------- */
function runMC(P,res){
  const{net,E,n,ctx,tr}=res;const N=clamp(Math.round(num(P.iters)||3000),200,20000);
  const r=mulberry32(num(P.seed)??20261014);const samp=P.dist==="beta"?sampleBeta:sampleTri;
  const o=mkOut(n),dur=new Float64Array(n),fins=new Float64Array(N),crit=new Uint32Array(n);
  const sx=new Float64Array(n),sxx=new Float64Array(n),sxy=new Float64Array(n);let sy=0,syy=0;
  for(let k=0;k<N;k++){
    for(let i=0;i<n;i++)dur[i]=samp(E[i],r);
    const f=sched(net,dur,ctx,o);fins[k]=f;sy+=f;syy+=f*f;
    for(let i=0;i<n;i++){if(o.LS[i]-o.ES[i]<1e-6&&!(tr[i]&&tr[i].st==="done"))crit[i]++;const x=dur[i];sx[i]+=x;sxx[i]+=x*x;sxy[i]+=x*f}
  }
  const ci=new Float64Array(n),cr=new Float64Array(n),ssi=new Float64Array(n);
  const vy=syy/N-(sy/N)**2;
  for(let i=0;i<n;i++){ci[i]=crit[i]/N;const vx=Math.max(0,sxx[i]/N-(sx[i]/N)**2);const cov=sxy[i]/N-(sx[i]/N)*(sy/N);cr[i]=vx>1e-12&&vy>1e-12?cov/Math.sqrt(vx*vy):0;
    ssi[i]=vy>1e-12?Math.sqrt(vx)/Math.sqrt(vy)*ci[i]:0;
    if(tr[i]&&tr[i].st==="done"){ci[i]=NaN;cr[i]=NaN;ssi[i]=NaN}}
  const sorted=Float64Array.from(fins).sort();const q=p=>sorted[Math.min(N-1,Math.floor(p*N))];
  const out={N,fins:sorted,ci,cr,ssi,p10:q(.1),p50:q(.5),p80:q(.8),p95:q(.95),mean:sy/N,sd:Math.sqrt(Math.max(0,vy)),dist:P.dist==="beta"?"beta":"tri"};
  if(res.targetIdx!=null){let c=0;for(const f of sorted)if(f<=res.targetIdx+1e-9)c++;out.pTarget=c/N}
  return out;
}

  if(S.mode==="loading"){m.innerHTML=`<div class="panel"><p class="muted">Carregando planos…</p></div>`;return}
  if(!S.projects.length){m.innerHTML=emptyState();return}
  if(!S.proj){m.innerHTML="";return}
  const tabs=[["cronograma","Cronograma"],["diagrama","Diagrama"],["tarefas","Ações"],["risco","Previsões"],["acomp","Andamento"],["importar","Importar e exportar"],["pessoas","Responsáveis"],["termos","Entenda os termos"]];

    <section class="kpis" id="kpis"></section>

    <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("")}</nav>

  if(S.tab==="diagrama")drawDiagram();
}

function renderKPIs(){
  const k=$("#kpis");if(!k)return;const r=S.res,P=S.proj;
  if(!r||!r.det){k.innerHTML=`<div class="kpi"><span class="eyebrow">Conclusão prevista</span><span class="v">—</span><span class="s">${r&&r.errors.length?"Corrija o problema indicado acima":"Cadastre ações para calcular"}</span></div>`;return}
  const cal=r.cal,d=r.det,mc=S.mc;
  const fin=cal.finD(d.fin,0);
  let late=r.targetIdx!=null&&d.fin>r.targetIdx+1e-9;
  const k1=`<div class="kpi${late?" crit":""}"><span class="eyebrow">Conclusão prevista</span><span class="v">${fdate(fin)}</span><span class="s">${f1(d.fin)} dias úteis, somando a sequência de ações mais longa</span><span class="tec">Termo técnico: caminho crítico (CPM)</span></div>`;
  const k2=mc?`<div class="kpi"><span class="eyebrow">Data segura de conclusão</span><span class="v">${fdate(cal.finD(mc.p80,0))}</span><span class="s">Em 8 de cada 10 simulações, o plano termina até esta data</span><span class="tec">Termo técnico: P80 da simulação de Monte Carlo</span></div>`
    :`<div class="kpi"><span class="eyebrow">Data segura de conclusão</span><span class="v">…</span><span class="s">simulando cenários</span></div>`;
  let k3;
  if(r.targetIdx==null)k3=`<div class="kpi"><span class="eyebrow">Chance de cumprir o prazo</span><span class="v">—</span><span class="s">Informe o prazo final em Configurar</span></div>`;
  else{const p=mc?mc.pTarget:null,cls=p==null?"":p>=.8?" ok":p>=.5?" warn":" crit";
    k3=`<div class="kpi${cls}"><span class="eyebrow">Chance de cumprir o prazo de ${fdate(parseISO(P.target))}</span><span class="v">${pctf(p)}</span><span class="s">Pela simulação. O cálculo tradicional diria ${pctf(r.pert.pTarget)}</span><span class="tec">Cálculo tradicional: método PERT</span></div>`}
  let k4;const ev=r.evm;
  if(!ev)k4=`<div class="kpi"><span class="eyebrow">Ritmo em relação ao plano</span><span class="v">—</span><span class="s">Guarde o plano original na aba Andamento</span></div>`;
  else if(ev.SPIt==null)k4=`<div class="kpi"><span class="eyebrow">Ritmo em relação ao plano</span><span class="v">—</span><span class="s">Informe a data da última atualização na aba Andamento</span></div>`;
  else{const c=ev.SPIt>=.95?" ok":ev.SPIt>=.85?" warn":" crit";k4=`<div class="kpi${c}"><span class="eyebrow">Ritmo em relação ao plano</span><span class="v">${pctf(ev.SPIt)}</span><span class="s">${ev.SPIt>=1?"No ritmo ou adiantado":`Equivale a ${f1(ev.S-ev.ESt)} dias úteis de atraso`}</span><span class="tec">Termo técnico: índice de desempenho de prazo, SPI(t)</span></div>`}
  k.innerHTML=k1+k2+k3+k4;
}
function stateOf(i){const k=S.res.tr[i];if(k)return k.st;return (num(S.res.net.list[i].pct)||0)>=100?"done":"todo"}

/* --- Gantt --- */
function viewGantt(){
  const r=S.res;if(!r||!r.n)return noTasks();if(!r.det)return"";
  const{net,det,cal,E}=r,mc=S.mc,B=S.proj.baseline&&S.proj.baseline.tasks;
  const px=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--px"))||22;
  let max=det.fin;if(B)for(const id in B)max=Math.max(max,B[id].ef);if(mc)max=Math.max(max,mc.p95);if(r.S)max=Math.max(max,r.S);if(r.targetIdx!=null)max=Math.max(max,r.targetIdx);
  const days=Math.ceil(max)+3,W=days*px;
  let head="",grid="",lastM=-1;
  for(let i=0;i<days;i++){const d=cal.date(i),dw=d.getUTCDay();
    if(d.getUTCMonth()!==lastM){lastM=d.getUTCMonth();head+=`<span class="mon" style="left:${i*px+3}px">${MESES[lastM]} ${String(d.getUTCFullYear()).slice(2)}</span>`}
    if(i===0||dw===1){grid+=`<i style="left:${i*px}px"></i>`;head+=`<span class="wk" style="left:${i*px+3}px">${d.getUTCDate()}</span>`}}
  const lines=[];
  if(r.S)lines.push(`<div class="gline status" style="left:${r.S*px}px"><span>atualizado em</span></div>`);
  if(r.targetIdx!=null)lines.push(`<div class="gline target" style="left:${r.targetIdx*px}px"><span>prazo</span></div>`);
  if(mc)lines.push(`<div class="gline p80" style="left:${mc.p80*px}px"><span>data segura</span></div>`);
  const rows=net.list.map((t,i)=>{
    const st=stateOf(i),cr=det.crit[i],es=det.ES[i],ef=det.EF[i],k=r.tr[i];
    const cls=st==="done"?"done":cr?"crit":"";
    const b=B&&B[t.id];
    const bb=b?`<div class="bbar" style="left:${b.es*px}px;width:${Math.max(2,(b.ef-b.es)*px)}px" title="Linha de base"></div>`:"";
    const pc=k?k.pct:clamp(num(t.pct)||0,0,100)/100;
    const bar=ef-es<1e-6?`<div class="ms ${cls}" style="left:${es*px-6}px" title="Marco"></div>`
      :`<div class="bar ${cls}" style="left:${es*px}px;width:${Math.max(3,(ef-es)*px)}px"><div class="pg" style="width:${pc*100}%"></div></div>`;
    const ci="";
    const tip=`${t.id} · ${t.name||""}${t.desc?"\n"+t.desc:""}\nInício ${fdate(cal.startD(es))} · Fim ${fdate(cal.finD(ef,es))}\nPrazo calculado ${f1(E[i].te)} dias úteis · Folga ${f1(det.fl[i])} dias úteis`;
    return`<div class="grow" title="${esc(tip)}"><div class="glab${cr&&st!=="done"?" crit":""}"><b>${esc(t.id)}</b><span>${esc(t.name||"")}</span></div><div class="gtrack" style="width:${W}px">${bb}${bar}${ci}</div></div>`}).join("");
  /* setas término → início */
  const RH=44,CY=20,showLinks=lsGet("cc.links")!=="0";let links="";
  if(showLinks){
    let pn="",pc="";
    net.list.forEach((t,j)=>{net.preds[j].forEach(i=>{
      const x1=det.EF[i]*px,y1=i*RH+CY,y2=j*RH+CY,mil=det.EF[j]-det.ES[j]<1e-6,x2=det.ES[j]*px-(mil?7:1);
      const c=det.crit[i]&&det.crit[j]&&Math.abs(det.EF[i]-det.ES[j])<1e-6;
      let d;
      if(x2-x1>=12)d=`M${x1} ${y1}H${x1+6}V${y2}H${x2}`;
      else{const yb=j>i?j*RH:(j+1)*RH;d=`M${x1} ${y1}H${x1+6}V${yb}H${x2-8}V${y2}H${x2}`}
      const ah=`M${x2} ${y2}l-6 -3.5v7z`;
      if(c)pc+=`<path class="lk c" d="${d}"/><path class="ah c" d="${ah}"/>`;else pn+=`<path class="lk" d="${d}"/><path class="ah" d="${ah}"/>`})});
    links=`<svg class="links" style="left:var(--lab)" width="${W}" height="${net.list.length*RH}" aria-hidden="true">${pn}${pc}</svg>`;
  }
  return`<div class="panel" style="padding:12px">
    <div class="legend"><span><i style="background:var(--crit-soft);border-color:var(--crit)"></i>sem folga: se atrasar, atrasa o plano <em>(caminho crítico)</em></span><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>tem folga</span><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>concluída</span>${B?`<span><i style="background:var(--base);border-color:var(--base);height:4px"></i>plano original <em>(linha de base)</em></span>`:""}<label class="chk"><input type="checkbox" id="linksTgl"${showLinks?" checked":""}> Mostrar setas de dependência</label></div>
    <div class="gwrap"><div class="gantt" style="width:calc(var(--lab) + ${W}px)">
      <div class="grow ghead"><div class="glab"><span class="eyebrow">Ação</span></div><div class="gtrack" style="width:${W}px">${head}</div></div>
      <div style="position:relative">
        <div class="gbg" style="left:var(--lab);width:${W}px">${grid}${lines.join("")}</div>
        ${links}${rows}
      </div></div></div>
    <p class="note">A régua conta só dias úteis: fins de semana e feriados cadastrados ficam de fora. Cada barra usa o prazo calculado da ação, uma média que dá mais peso à estimativa mais provável. As setas mostram que uma ação só começa quando a anterior termina.</p>
  </div>`;
}
function noTasks(){return`<div class="panel empty"><h2>Este plano ainda não tem ações</h2><p class="note">Cadastre as ações na aba Ações ou cole a lista de uma planilha na aba Importar e exportar.</p><div class="row"><button class="btn primary" data-tab="tarefas">Cadastrar ações</button><button class="btn" data-tab="importar">Importar de planilha</button></div></div>`}

let dZoom=null;
function stagesOf(list){const out=[];list.forEach(t=>{const g=String(t.stage||"").trim();if(g&&!out.includes(g))out.push(g)});return out}
function viewDiagram(){
  const r=S.res;if(!r||!r.n)return noTasks();if(!r.det)return"";
  const near=num(S.proj.nearCrit)??10,showOwn=lsGet("cc.downers")!=="0",st=stagesOf(r.net.list);
  return`<div class="panel" style="padding:12px">
    <div><span class="eyebrow">Fluxo das ações</span> <span class="tec">Termo técnico: diagrama de rede (PERT/CPM)</span></div>
    <div class="dleg"><span><i style="background:var(--crit-soft);border-color:var(--crit)"></i>sem folga <em>(crítica)</em></span><span><i style="background:var(--warn-soft);border-color:var(--warn)"></i>quase sem folga: até ${near} dias</span><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>com folga</span><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>concluída</span>
      <span><b style="color:var(--ok-ink)">✓</b>concluída</span><span><b style="color:var(--accent)">▶</b>em andamento</span><span><b style="color:var(--crit-ink)">!</b>atrasada em relação ao plano original</span></div>
    <div class="row"><label class="chk"><input type="checkbox" id="dOwners"${showOwn?" checked":""}> Mostrar responsáveis (siglas)</label><div class="spacer"></div>
      <button class="btn small" data-act="dzoom" data-z="-1" aria-label="Reduzir">−</button><button class="btn small" data-act="dzoom" data-z="0">Ajustar à tela</button><button class="btn small" data-act="dzoom" data-z="1" aria-label="Ampliar">+</button></div>
    <div class="dwrap" id="dwrap"><div id="diag"><p class="muted">Desenhando…</p></div></div>
    <p class="note">Cada caixa é uma ação, com o código, o nome, o prazo calculado e a folga. As setas mostram a ordem: uma ação só começa quando as anteriores terminam. As setas vermelhas ligam as ações sem folga, do início ao fim do plano.${st.length?" Os blocos agrupam as ações por etapa.":""} No celular, arraste para navegar.</p>
  </div>`;
}
function wrapText(t,max){const w=String(t).split(/\s+/),L=[];let c="";for(const x of w){if(!c)c=x;else if((c+" "+x).length<=max)c+=" "+x;else{L.push(c);c=x}}if(c)L.push(c);return L}
function drawDiagram(){
  const box=$("#diag");if(!box)return;
  if(!window.dagre){box.innerHTML=`<p class="muted">Não foi possível carregar o componente de desenho. Verifique a conexão e recarregue a página.</p>`;return}
  const r=S.res,{net,det,cal,E,tr}=r,P=S.proj,near=num(P.nearCrit)??10,showOwn=lsGet("cc.downers")!=="0";
  const B=P.baseline&&P.baseline.tasks,NW=158,LH=14,MAX=24;
  const g=new dagre.graphlib.Graph({compound:true});g.setGraph({rankdir:"LR",nodesep:34,ranksep:40,edgesep:10,marginx:20,marginy:34});g.setDefaultEdgeLabel(()=>({}));
  const stages=stagesOf(net.list),cid=k=>"__c"+k;
  stages.forEach((st,k)=>g.setNode(cid(k),{label:st}));
  const info=[];
  net.list.forEach((t,i)=>{
    const k=tr[i],done=k?k.st==="done":(num(t.pct)||0)>=100,prog=k&&k.st==="prog";
    const late=!done&&B&&B[t.id]&&det.EF[i]-B[t.id].ef>0.5;
    const cls=done?"done":det.crit[i]?"crit":det.fl[i]<=near+1e-9?"near":"norm";
    const icon=done?"✓":late?"!":prog?"▶":"";
    const title=wrapText(`${t.id} · ${t.name||""}`,MAX);
    const meta=done?(t.aF?`concluída em ${fdate(parseISO(t.aF))}`:"concluída"):`${Math.round(E[i].te)} d · folga ${det.crit[i]?0:Math.floor(det.fl[i]+1e-9)}`;
    const own=showOwn?wrapText(ownersText(t,true),MAX-1):[];
    const h=12+(title.length+1+own.length)*LH+6;
    info[i]={cls,icon,iconCls:done?"done":late?"late":"prog",title,meta,own,h};
    g.setNode("t"+i,{width:NW,height:h});
    if(t.stage){const k2=stages.indexOf(String(t.stage).trim());if(k2>=0)g.setParent("t"+i,cid(k2))}
  });
  const sd=cal.date(0),fd=cal.finD(det.fin,0);
  g.setNode("__s",{width:86,height:86});g.setNode("__e",{width:96,height:96});
  net.list.forEach((t,i)=>{
    if(!net.preds[i].length)g.setEdge("__s","t"+i,{c:det.crit[i]&&det.ES[i]<1e-6});
    net.preds[i].forEach(p=>g.setEdge("t"+p,"t"+i,{c:det.crit[p]&&det.crit[i]&&Math.abs(det.EF[p]-det.ES[i])<1e-6}));
    if(!net.succ[i].length)g.setEdge("t"+i,"__e",{c:det.crit[i]&&Math.abs(det.EF[i]-det.fin)<1e-6});
  });
  try{dagre.layout(g)}catch(e){box.innerHTML=`<p class="muted">Não foi possível desenhar o diagrama: ${esc(e.message)}</p>`;return}
  /* ---- pós-processamento: colunas, portas, trilhos exclusivos e alargamento dos corredores ---- */
  const SP=8,MARG=14,HSEP=7;
  const ids=g.nodes().filter(id=>!id.startsWith("__c"));
  const N={};ids.forEach(id=>{const n=g.node(id);N[id]={id,cx:n.x,cy:n.y,w:n.width,h:n.height,round:id==="__s"||id==="__e"}});
  const xs=[...new Set(ids.map(id=>Math.round(N[id].cx)))].sort((a,b)=>a-b);
  const colIx=new Map(xs.map((x,i)=>[x,i]));ids.forEach(id=>N[id].col=colIx.get(Math.round(N[id].cx)));
  const nC=xs.length,colR=[],colL=[];for(let c=0;c<nC;c++){const m=ids.filter(id=>N[id].col===c);colR[c]=Math.max(...m.map(id=>N[id].cx+N[id].w/2));colL[c]=Math.min(...m.map(id=>N[id].cx-N[id].w/2))}
  const byCol=c=>ids.filter(id=>N[id].col===c);
  /* arestas: caminho pelas vagas reservadas pelo dagre em cada coluna intermediária */
  const H0=Math.ceil(g.graph().height);
  const colX=c=>xs[c];
  const EDG=g.edges().map(e=>({s:e.v,t:e.w,c:!!g.edge(e).c,pts:(g.edge(e).points||[]).slice(1,-1)}));
  EDG.forEach(e=>{const cs=N[e.s].col,ct=N[e.t].col;e.cs=cs;e.ct=ct;e.wp=[];
    for(let c=cs+1;c<ct;c++){let best=null,bd=1e9;e.pts.forEach(p=>{const d=Math.abs(p.x-colX(c));if(d<bd){bd=d;best=p}});
      e.wp.push(best&&bd<NW?best.y:(e.wp.length?e.wp[e.wp.length-1]:(N[e.s].cy+N[e.t].cy)/2))}
    e.outKey=e.wp.length?e.wp[0]:N[e.t].cy;e.inKey=e.wp.length?e.wp[e.wp.length-1]:N[e.s].cy});
  const portY=(node,k,m)=>{const span=node.round?node.h*0.62:node.h-14,start=node.round?node.cy-span/2:node.cy-node.h/2+7;return m===1?node.cy:start+span*(k+0.5)/m};
  ids.forEach(id=>{const outs=EDG.filter(e=>e.s===id).sort((a,b)=>a.outKey-b.outKey||a.ct-b.ct);outs.forEach((e,k)=>e.y1=portY(N[id],k,outs.length));
    const ins=EDG.filter(e=>e.t===id).sort((a,b)=>a.inKey-b.inKey||b.cs-a.cs);ins.forEach((e,k)=>e.y2=portY(N[id],k,ins.length))});
  /* escolha do traçado de cada seta longa: vagas do dagre, "subir/descer cedo" ou "subir/descer tarde", pelo menor número estimado de cruzamentos */
  EDG.forEach(e=>{e.Y={};e.Y[e.cs]=e.y1;e.Y[e.ct]=e.y2;e.wp.forEach((y,j)=>e.Y[e.cs+1+j]=y)});
  const nodeHit=(c,y)=>byCol(c).some(id=>{const n=N[id];return y>n.cy-n.h/2-8&&y<n.cy+n.h/2+8});
  const laneHit=(c,y,self)=>EDG.some(o=>o!==self&&o.cs<c&&o.ct>c&&Math.abs(o.Y[c]-y)<7);
  const segsOf=e=>{const out=[];for(let k=e.cs;k<e.ct;k++){const a=e.Y[k],b=e.Y[k+1];out.push({k,lo:Math.min(a,b),hi:Math.max(a,b),flat:Math.abs(a-b)<0.6,y:a})}return out};
  const costOf=(e,Y)=>{const save=e.Y;e.Y=Y;const mine=segsOf(e);let c=0;
    EDG.forEach(o=>{if(o===e)return;segsOf(o).forEach(t=>{mine.forEach(m=>{if(m.k!==t.k)return;
      if(m.flat&&!t.flat&&m.y>t.lo+0.5&&m.y<t.hi-0.5)c++;else if(!m.flat&&t.flat&&t.y>m.lo+0.5&&t.y<m.hi-0.5)c++})})});
    c+=mine.filter(m=>!m.flat).length*0.35;e.Y=save;return c};
  const selectRoutes=rounds=>{for(let round=0;round<rounds;round++)EDG.filter(e=>e.ct-e.cs>1).sort((a,b)=>(b.c?1:0)-(a.c?1:0)).forEach(e=>{
    const opts=[];const mk=f=>{const Y={};Y[e.cs]=e.y1;Y[e.ct]=e.y2;for(let c=e.cs+1;c<e.ct;c++)Y[c]=f(c);return Y};
    opts.push({Y:mk(c=>e.wp[c-e.cs-1]),bias:-0.2,kind:"d"});
    opts.push({Y:mk(()=>e.y1),bias:0,kind:"late"});opts.push({Y:mk(()=>e.y2),bias:0,kind:"early"});
    let best=null,bc=1e9;opts.forEach(o=>{for(let c=e.cs+1;c<e.ct;c++){if(nodeHit(c,o.Y[c])||laneHit(c,o.Y[c],e))return}const v=costOf(e,o.Y)+o.bias;if(v<bc){bc=v;best=o}});
    if(best){e.Y=best.Y;e.kind=best.kind}})};
  /* reatribui portas pela direção real que cada seta toma, e ajusta os traçados que dependiam da porta */
  const reassignPorts=()=>{ids.forEach(id=>{
    const outs=EDG.filter(e=>e.s===id).sort((a,b)=>a.Y[a.cs+1]-b.Y[b.cs+1]||(a.Y[a.ct]-b.Y[b.ct]));
    outs.forEach((e,k)=>{const ny=portY(N[id],k,outs.length),oy=e.y1;e.y1=ny;e.Y[e.cs]=ny;if(e.kind==="late")for(let c=e.cs+1;c<e.ct;c++)if(Math.abs(e.Y[c]-oy)<0.01)e.Y[c]=ny});
    const ins=EDG.filter(e=>e.t===id).sort((a,b)=>a.Y[a.ct-1]-b.Y[b.ct-1]||(b.cs-a.cs));
    ins.forEach((e,k)=>{const ny=portY(N[id],k,ins.length),oy=e.y2;e.y2=ny;e.Y[e.ct]=ny;if(e.kind==="early")for(let c=e.cs+1;c<e.ct;c++)if(Math.abs(e.Y[c]-oy)<0.01)e.Y[c]=ny})})};
  selectRoutes(2);reassignPorts();selectRoutes(1);reassignPorts();
  /* trechos verticais por corredor */
  const vsegs=[];
  EDG.forEach(e=>{e.vs=[];for(let k=e.cs;k<e.ct;k++){const v={gap:k,yin:e.Y[k],yout:e.Y[k+1],e};v.lo=Math.min(v.yin,v.yout);v.hi=Math.max(v.yin,v.yout);v.flat=v.hi-v.lo<0.6;e.vs.push(v);if(!v.flat)vsegs.push(v)}});
  /* ordem dos trilhos que minimiza cruzamentos (inserção gulosa) */
  const inside=(y,v)=>y>v.lo+0.5&&y<v.hi-0.5;
  const crossPair=(L,R)=>(inside(R.yin,L)?1:0)+(inside(L.yout,R)?1:0); /* L à esquerda de R */
  const tracksIn=[];
  for(let gp=0;gp<nC-1;gp++){const segs=vsegs.filter(v=>v.gap===gp).sort((a,b)=>(b.hi-b.lo)-(a.hi-a.lo));const ord=[];
    segs.forEach(v=>{let bestI=0,bestC=1e9;for(let i=0;i<=ord.length;i++){let c=0;for(let k=0;k<ord.length;k++)c+=k<i?crossPair(ord[k],v):crossPair(v,ord[k]);if(c<bestC||(c===bestC&&v.e.c&&i===ord.length)){bestC=c;bestI=i}}ord.splice(bestI,0,v)});
    ord.forEach((v,i)=>v.slot=i);tracksIn[gp]=ord.length}
  /* alarga corredores */
  const shift=[0];for(let gp=0;gp<nC-1;gp++){const need=(tracksIn[gp]||0)*SP+2*MARG,cur=colL[gp+1]-colR[gp];shift[gp+1]=shift[gp]+Math.max(0,need-cur)}
  ids.forEach(id=>{N[id].x=N[id].cx+shift[N[id].col]});
  const gapMid=gp=>((colR[gp]+shift[gp])+(colL[gp+1]+shift[gp+1]))/2;
  const trackX=(gp,slot)=>gapMid(gp)+(slot-((tracksIn[gp]||1)-1)/2)*SP;
  const W=Math.ceil(g.graph().width+shift[nC-1]),H=H0+24;
  const CL=["#00A990","#F47216","#C49331","#6E8FA8","#F6836C","#987126"];
  let svg=`<defs><marker id="ahN" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker><marker id="ahC" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah c" d="M0,0 L8,4 L0,8 z"/></marker></defs>`;
  stages.forEach((st,k)=>{const c=g.node(cid(k));if(!c||!c.width)return;const mem=g.children(cid(k)).filter(id=>N[id]);if(!mem.length)return;const col=CL[k%CL.length];
    const x0=Math.min(...mem.map(id=>N[id].x-N[id].w/2))-18,x1=Math.max(...mem.map(id=>N[id].x+N[id].w/2))+18,y=c.y-c.height/2,h=c.height;
    svg+=`<g class="cl"><rect x="${x0}" y="${y}" width="${x1-x0}" height="${h}" rx="6" fill="${col}" fill-opacity=".10" stroke="${col}"/><text x="${x0+10}" y="${y+16}">${esc(st)}</text></g>`});
  const edgeX=(node,y,side)=>{if(node.round){const r=node.w/2,dy=Math.min(Math.abs(y-node.cy),r-1);return node.x+side*Math.sqrt(r*r-dy*dy)}return node.x+side*node.w/2};
  const rounded=pts=>{let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length-1;i++){const[p0x,p0y]=pts[i-1],[px,py]=pts[i],[nx,ny]=pts[i+1];const l1=Math.hypot(px-p0x,py-p0y),l2=Math.hypot(nx-px,ny-py),r=Math.min(5,l1/2,l2/2);
      if(r<0.5){d+=` L${px} ${py}`;continue}const ax=px-(px-p0x)/l1*r,ay=py-(py-p0y)/l1*r,bx=px+(nx-px)/l2*r,by=py+(ny-py)/l2*r;d+=` L${ax} ${ay} Q${px} ${py} ${bx} ${by}`}
    const L=pts[pts.length-1];return d+` L${L[0]} ${L[1]}`};
  const crit=[],norm=[];
  EDG.forEach(e=>{const S0=N[e.s],T0=N[e.t],x1=edgeX(S0,e.y1,1),x2=edgeX(T0,e.y2,-1)-1;let pts=[[x1,e.y1]];
    e.vs.forEach(v=>{if(v.flat)return;const x=trackX(v.gap,v.slot);pts.push([x,v.yin],[x,v.yout])});pts.push([x2,e.y2]);
    pts=pts.filter((p,i)=>i===0||Math.abs(p[0]-pts[i-1][0])>0.1||Math.abs(p[1]-pts[i-1][1])>0.1);
    (e.c?crit:norm).push(`<path class="ed${e.c?" c":""}" d="${rounded(pts)}" marker-end="url(#${e.c?"ahC":"ahN"})"/>`)});
  svg+=norm.join("")+crit.join("");
  const s0=N.__s,e0=N.__e;
  svg+=`<g class="term"><circle cx="${s0.x}" cy="${s0.cy}" r="43"/><text x="${s0.x}" y="${s0.cy-3}" text-anchor="middle">Início</text><text x="${s0.x}" y="${s0.cy+13}" text-anchor="middle">${fdate(sd)}</text></g>`;
  svg+=`<g class="term"><circle cx="${e0.x}" cy="${e0.cy}" r="48"/><text x="${e0.x}" y="${e0.cy-10}" text-anchor="middle">Fim</text><text x="${e0.x}" y="${e0.cy+5}" text-anchor="middle">${fdate(fd)}</text><text x="${e0.x}" y="${e0.cy+20}" text-anchor="middle" style="font-weight:400">${f1(det.fin)} d úteis</text></g>`;
  net.list.forEach((t,i)=>{const n=N["t"+i],o=info[i],cx=n.x,x=cx-NW/2,y=n.cy-o.h/2;let ty=y+16;
    let txt=o.title.map((l,k)=>{const yy=ty+k*LH;let line=esc(l);if(k===0){const cut=l.indexOf(" · ");line=cut>0?`<tspan class="cd">${esc(l.slice(0,cut))}</tspan>${esc(l.slice(cut))}`:`<tspan class="cd">${esc(l)}</tspan>`}
      return`<text x="${cx}" y="${yy}" text-anchor="middle">${k===0&&o.icon?`<tspan class="ic ${o.iconCls}" font-weight="700">${o.icon} </tspan>`:""}${line}</text>`}).join("");
    ty+=o.title.length*LH;txt+=`<text class="meta" x="${cx}" y="${ty}" text-anchor="middle">${esc(o.meta)}</text>`;
    o.own.forEach((l,k)=>{txt+=`<text class="own" x="${cx}" y="${ty+(k+1)*LH}" text-anchor="middle">${esc(l)}</text>`});
    svg+=`<g class="nd ${o.cls}"><title>${esc(`${t.id} · ${t.name||""}\nInício ${fdate(cal.startD(det.ES[i]))} · Fim ${fdate(cal.finD(det.EF[i],det.ES[i]))}`)}</title><rect x="${x}" y="${y}" width="${NW}" height="${o.h}" rx="3"/>${txt}</g>`});
  const wrap=$("#dwrap"),cw=wrap?wrap.clientWidth-20:W;
  if(dZoom==null)dZoom=Math.max(.55,Math.min(1,cw/W));
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${Math.round(W*dZoom)}" height="${Math.round(H*dZoom)}" role="img" aria-label="Diagrama de rede das ações do plano">${svg}</svg>`;
}

      <tbody>${rows||`<tr><td colspan="19" class="muted">Nenhuma ação. Use o formulário acima ou a aba Importar e exportar.</td></tr>`}</tbody></table></div>
  </div>`;
}

const pick=document.createElement("div");pick.id="pick";pick.hidden=true;pick.setAttribute("role","listbox");document.body.appendChild(pick);
let pkState={el:null,opts:[],idx:0};
const personById=id=>S.people.find(x=>x.id===id);
const personShort=x=>x?(x.sigla||x.name||"?"):(S.peopleLoaded?"(removido)":"…");
function ownersOf(t){return Array.isArray(t.owners)?t.owners:[]}
function ownersText(t,short){const o=ownersOf(t);if(!o.length)return t.owner||"";return o.map(id=>{const x=personById(id);return short?personShort(x):(x?x.name:(S.peopleLoaded?"(removido)":"…"))}).join(", ")}
function pkVals(el){return(el.dataset.val||"").split(",").filter(Boolean)}
function pkHTML(kind,owner,vals,ro){
  const tags=vals.map(v=>{let lab,tip;if(kind==="own"){const x=personById(v);lab=personShort(x);tip=x?x.name+(x.unit?" · "+x.unit:""):"Responsável removido da lista"}else{const t=S.tasks.find(t=>t.id===v);lab=v;tip=t?(t.name||v):"código sem ação correspondente"}
    return`<span class="tag" title="${esc(tip)}">${esc(lab)}${ro?"":`<button type="button" class="pk-rm" data-v="${esc(v)}" aria-label="Remover ${esc(lab)}">×</button>`}</span>`}).join("");
  const ph=vals.length?"+":kind==="own"?"buscar nome ou sigla":"buscar código ou nome";
  return tags+(ro?"":`<input type="text" class="pk-in" id="pk-${kind}-${esc(owner)}" placeholder="${ph}" autocomplete="off" aria-label="${kind==="own"?"Adicionar responsável":"Adicionar dependência"}" aria-autocomplete="list">`)}
function picker(kind,owner,vals,ro){return`<div class="pk" data-kind="${kind}" data-pk="${esc(owner)}" data-val="${esc(vals.join(","))}">${pkHTML(kind,owner,vals,ro)||'<span class="muted">—</span>'}</div>`}
function descendants(id){const net=S.res&&S.res.net,out=new Set();if(!net||!net.pos.has(id))return out;const st=[net.pos.get(id)];
  while(st.length){const i=st.pop();for(const x of net.succ[i]){const sid=net.list[x].id;if(!out.has(sid)){out.add(sid);st.push(x)}}}return out}
function pkPos(el){const r=el.getBoundingClientRect(),w=Math.min(380,window.innerWidth-32);pick.style.width=w+"px";pick.style.left=Math.max(16,Math.min(r.left,window.innerWidth-w-16))+"px";
  const below=window.innerHeight-r.bottom;if(below<220&&r.top>below){pick.style.top="";pick.style.bottom=(window.innerHeight-r.top+4)+"px"}else{pick.style.bottom="";pick.style.top=(r.bottom+4)+"px"}}
function pkOpen(el){const inp=el.querySelector(".pk-in");if(!inp)return;const raw=inp.value.trim(),q=normKey(raw),kind=el.dataset.kind,owner=el.dataset.pk,cur=new Set(pkVals(el));let opts=[],note="";
  if(kind==="own"){
    opts=S.people.filter(x=>!cur.has(x.id)&&(!q||normKey(x.name||"").includes(q)||normKey(x.sigla||"").includes(q)||normKey(x.unit||"").includes(q)))
      .sort((a,b)=>(normKey(b.sigla||"")===q?2:normKey(b.name||"").startsWith(q)?1:0)-(normKey(a.sigla||"")===q?2:normKey(a.name||"").startsWith(q)?1:0)||(a.name||"").localeCompare(b.name||"","pt-BR"))
      .map(x=>({id:x.id,code:x.sigla||"",label:x.name+(x.unit?" · "+x.unit:"")}));
    if(raw&&S.canWrite&&!S.people.some(x=>normKey(x.name)===q))opts.push({id:"__create",code:"+",label:`Cadastrar “${raw}” como responsável`,raw});
    if(!S.people.length&&!raw)note="Nenhum responsável cadastrado. Digite um nome para cadastrar, ou use a aba Responsáveis.";
  }else{
    const bad=owner==="__new"?new Set():descendants(owner);
    let list=[...S.tasks].sort((a,b)=>(a.order??0)-(b.order??0)).filter(t=>t.id!==owner&&!cur.has(t.id)&&!bad.has(t.id)&&(!q||normKey(t.id).includes(q)||normKey(t.name||"").includes(q)));
    if(q)list.sort((a,b)=>(normKey(b.id).startsWith(q)?1:0)-(normKey(a.id).startsWith(q)?1:0));
    opts=list.map(t=>({id:t.id,code:t.id,label:t.name||""}));
    if(!opts.length)note=(q?"Nenhuma ação encontrada com esse código ou nome.":"Não há outras ações disponíveis.")+(bad.size?" Ações que dependem desta não aparecem, para não criar dependência em círculo.":"");
  }
  pkState={el,opts:opts.slice(0,50),idx:0};
  pick.innerHTML=pkState.opts.length?pkState.opts.map((o,k)=>`<div class="op${o.id==="__create"?" add":""}" role="option" data-k="${k}" aria-selected="${k===0}"><b>${esc(o.code)}</b><span>${esc(o.label)}</span></div>`).join(""):`<div class="none">${esc(note||"Nada encontrado.")}</div>`;
  pkPos(el);pick.hidden=false}
function pkClose(){pick.hidden=true;pkState.el=null}
function pkMark(){pick.querySelectorAll(".op").forEach((o,k)=>o.setAttribute("aria-selected",String(k===pkState.idx)));const o=pick.querySelector(`.op[data-k="${pkState.idx}"]`);if(o)o.scrollIntoView({block:"nearest"})}
async function pkSet(el,vals,reopen){el.dataset.val=vals.join(",");const owner=el.dataset.pk,kind=el.dataset.kind;el.innerHTML=pkHTML(kind,owner,vals,false);const inp=el.querySelector(".pk-in");if(inp)inp.focus();
  if(reopen)pkOpen(el);else pkClose();

async function pkChoose(k){const el=pkState.el,o=pkState.opts[k];if(!el||!o)return;

document.addEventListener("input",e=>{const t=e.target;if(t.classList&&t.classList.contains("pk-in"))pkOpen(t.closest(".pk"))});
document.addEventListener("focusin",e=>{const t=e.target;if(t.classList&&t.classList.contains("pk-in"))pkOpen(t.closest(".pk"))});
document.addEventListener("focusout",e=>{const t=e.target;if(t.classList&&t.classList.contains("pk-in"))setTimeout(()=>{const a=document.activeElement;if(!(a&&a.classList&&a.classList.contains("pk-in")))pkClose()},150)});
document.addEventListener("keydown",e=>{const t=e.target;if(!(t.classList&&t.classList.contains("pk-in")))return;const el=t.closest(".pk");
  if(e.key==="ArrowDown"){e.preventDefault();if(pick.hidden)pkOpen(el);else{pkState.idx=Math.min(pkState.opts.length-1,pkState.idx+1);pkMark()}}
  else if(e.key==="ArrowUp"){e.preventDefault();pkState.idx=Math.max(0,pkState.idx-1);pkMark()}

async function createPerson(name,sigla,unit){name=String(name||"").trim();if(!name){toast("Informe o nome do responsável.");return null}
  if(S.people.some(x=>normKey(x.name)===normKey(name))){toast(`“${name}” já está na lista de responsáveis.`);return S.people.find(x=>normKey(x.name)===normKey(name)).id}
  const id=Store.newPersonId();const ok=await W(()=>Store.setPerson(id,{name,sigla:String(sigla||"").trim(),unit:String(unit||"").trim(),createdAt:new Date().toISOString()}));
  if(ok){S.people=[...S.people.filter(x=>x.id!==id),{id,name,sigla:String(sigla||"").trim(),unit:String(unit||"").trim()}].sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"))}
  return ok?id:null}

function parsePeople(txt){
  const lines=String(txt||"").replace(/\r/g,"").split("\n").filter(l=>l.trim());const warns=[];if(!lines.length)return{rows:[],warns:["Nada para cadastrar."]};
  const sep=lines.some(l=>l.includes("\t"))?"\t":lines.some(l=>l.includes(";"))?";":",";
  let cols={name:0,sigla:1,unit:2},body=lines;const h=splitRow(lines[0],sep).map(normKey);
  if(h.some(x=>x==="nome"||x==="responsavel"||x==="responsaveis")){cols={name:-1,sigla:-1,unit:-1};
    h.forEach((x,i)=>{if(cols.name<0&&["nome","responsavel","responsaveis","pessoa"].includes(x))cols.name=i;else if(cols.sigla<0&&["sigla","abreviacao","apelido"].includes(x))cols.sigla=i;else if(cols.unit<0&&["setor","unidade","lotacao","departamento","area"].includes(x))cols.unit=i});
    if(cols.name<0)cols.name=0;body=lines.slice(1)}
  const seen=new Set(),rows=[];
  for(const l of body){const c=splitRow(l,sep).map(x=>x.trim());const name=(c[cols.name]||"").replace(/\s+/g," ").trim();if(!name)continue;
    const k=normKey(name);if(seen.has(k)){warns.push(`“${name}” aparece mais de uma vez; considerei só a primeira.`);continue}seen.add(k);
    const sigla=cols.sigla>=0?(c[cols.sigla]||"").slice(0,12):"",unit=cols.unit>=0?(c[cols.unit]||""):"";
    if(cols.sigla>=0&&(c[cols.sigla]||"").length>12)warns.push(`A sigla de “${name}” foi cortada em 12 caracteres.`);
    const ex=S.people.find(x=>normKey(x.name)===k);rows.push({name,sigla,unit,existing:ex?ex.id:null})}
  if(!rows.length)warns.push("Não encontrei nomes nas linhas coladas.");
  return{rows,warns};
}

  for(const r of imp.rows){if(r.existing){const d={};if(r.sigla)d.sigla=r.sigla;if(r.unit)d.unit=r.unit;if(Object.keys(d).length&&await W(()=>Store.updatePerson(r.existing,d)))u++}
    else if(await createPerson(r.name,r.sigla,r.unit))c++}
  S.pimp=null;renderMain();toast(`${c} responsáveis cadastrados${u?` e ${u} atualizados`:""}.`)}

/* --- Risco --- */
function viewRisk(){
  const r=S.res,mc=S.mc;if(!r||!r.n)return noTasks();if(!r.det)return"";
  if(!mc)return`<div class="panel"><p class="muted">Simulando cenários…</p></div>`;
  const cal=r.cal,P=S.proj;
  const lo=mc.fins[0],hi=mc.fins[mc.N-1],nb=24,span=Math.max(hi-lo,1e-6),bw=span/nb,bins=new Array(nb).fill(0);
  for(const f of mc.fins)bins[Math.min(nb-1,Math.floor((f-lo)/bw))]++;
  const Wd=640,Hd=240,L=40,R=16,T=18,Bm=34,pw=Wd-L-R,ph=Hd-T-Bm,mx=Math.max(...bins);
  const X=v=>L+(v-lo)/span*pw;
  let svg=`<svg class="chart" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Distribuição simulada do término do projeto">`;
  for(let g=0;g<=4;g++){const y=T+ph-g/4*ph;svg+=`<line class="gr" x1="${L}" x2="${Wd-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${g*25}%</text>`}
  bins.forEach((c,b)=>{const h=c/mx*ph;svg+=`<rect class="hb" x="${L+b/nb*pw+1}" y="${T+ph-h}" width="${pw/nb-2}" height="${h}"/>`});
  let pts=[],acc=0;bins.forEach((c,b)=>{acc+=c;pts.push(`${L+(b+1)/nb*pw},${T+ph-acc/mc.N*ph}`)});
  svg+=`<polyline class="cdf" points="${L},${T+ph} ${pts.join(" ")}"/>`;
  svg+=`<line class="ax" x1="${L}" x2="${Wd-R}" y1="${T+ph}" y2="${T+ph}"/>`;
  for(let g=0;g<=4;g++){const v=lo+g/4*span;svg+=`<text x="${X(v)}" y="${Hd-12}" text-anchor="middle">${fdate(cal.finD(v,0))}</text>`}
  const mark=(v,cls,lab,dy=0)=>{if(v<lo-1e-9||v>hi+1e-9)return"";const x=X(v);return`<line class="vl ${cls}" x1="${x}" x2="${x}" y1="${T}" y2="${T+ph}"/><text class="${cls==="t"?"t":cls==="c"?"c":"lbl"}" x="${x+4}" y="${T+10+dy}">${lab}</text>`};
  svg+=mark(mc.p80,"p","data segura",0)+mark(r.det.fin,"c","conta simples",13);
  if(r.targetIdx!=null)svg+=mark(r.targetIdx,"t","prazo",26);
  svg+=`</svg>`;
  const order=r.net.list.map((t,i)=>i).filter(i=>Number.isFinite(mc.ssi[i])).sort((a,b)=>mc.ssi[b]-mc.ssi[a]||mc.ci[b]-mc.ci[a]);
  const smax=Math.max(1e-9,...order.map(i=>mc.ssi[i]));
  const rows=order.map(i=>{const t=r.net.list[i],E=r.E[i];return`<tr class="${r.det.crit[i]?"crit":""}"><td class="code">${esc(t.id)}</td><td>${esc(t.name||"")}</td>
    <td class="n"><span class="cibar"><i style="width:${mc.ssi[i]/smax*100}%"></i></span>${f2(mc.ssi[i])}</td>
    <td class="n">${pctf(mc.ci[i])}</td><td class="n">${f2(mc.cr[i])}</td>
    <td class="n">${f1(E.o)} / ${f1(E.m)} / ${f1(E.p)}</td><td class="n">${f1(E.te)}</td><td class="n">${r.det.crit[i]?`<span class="chip crit">0</span>`:f1(r.det.fl[i])}</td></tr>`}).join("");
  const merge=mc.p50-r.det.fin;
  return`<div class="cols">
    <div class="panel"><div><span class="eyebrow">Em que data o plano pode terminar</span></div>
      <p class="note">O sistema sorteou ${mc.N.toLocaleString("pt-BR")} vezes um prazo para cada ação, dentro das estimativas de melhor e pior caso, e calculou a data final de cada sorteio. As barras mostram quantas vezes cada data apareceu; a linha mostra a chance acumulada de terminar até ela. <span class="tec">Termo técnico: simulação de Monte Carlo, com distribuição ${mc.dist==="beta"?"beta-PERT":"triangular"}.</span></p>${svg}
      <div class="cols3"><div class="stat"><small>Se tudo correr bem</small><b>${fdate(cal.finD(mc.p10,0))}</b><span class="tec">só 1 em 10 termina antes (P10)</span></div><div class="stat"><small>Cenário do meio</small><b>${fdate(cal.finD(mc.p50,0))}</b><span class="tec">metade termina antes (mediana, P50)</span></div><div class="stat"><small>Se houver muitos contratempos</small><b>${fdate(cal.finD(mc.p95,0))}</b><span class="tec">95 em 100 terminam antes (P95)</span></div></div>
    </div>
    <div class="panel"><span class="eyebrow">Por que a simulação dá datas mais tardias?</span>
      <div class="cols3"><div class="stat crit"><small>Pela conta simples</small><b>${f1(r.det.fin)} d</b><span class="tec">caminho crítico (CPM)</span></div><div class="stat"><small>Média das simulações</small><b>${f1(mc.mean)} d</b></div><div class="stat"><small>Variação típica</small><b>± ${f1(mc.sd)} d</b><span class="tec">desvio-padrão</span></div></div>
      <p class="note">A conta simples soma os prazos de uma única sequência de ações, a mais longa. Mas o plano tem várias sequências correndo ao mesmo tempo, e basta uma delas atrasar para o plano inteiro atrasar. A simulação considera isso. Neste plano, a diferença no cenário do meio é de <b>${f1(merge)} dias úteis</b>. <span class="tec">Termo técnico: viés de convergência de caminhos (merge bias).</span></p>
      ${r.targetIdx!=null?`<p class="note">Para o prazo de ${fdate(parseISO(P.target))}, o cálculo tradicional, que olha só a sequência mais longa, dá <b>${pctf(r.pert.pTarget)}</b> de chance. A simulação, que olha todas as sequências, dá <b>${pctf(mc.pTarget)}</b>. <span class="tec">Cálculo tradicional: método PERT.</span></p>`:`<p class="note">Informe o prazo final em Configurar para ver a chance de cumpri-lo.</p>`}
    </div></div>
    <div class="panel" style="margin-top:16px"><span class="eyebrow">Onde vale mais a pena agir</span>
      <p class="note">A lista está ordenada pela <b>prioridade de atenção</b>: no topo ficam as ações que, ao mesmo tempo, costumam definir a data final e têm prazo incerto. Reforçar o acompanhamento, detalhar o planejamento ou alocar mais gente nelas é o que mais protege o prazo. <span class="tec">Termo técnico: índice de sensibilidade do cronograma (SSI), do PMI.</span></p>
      <p class="note">Colunas de apoio: <b>chance de ditar o prazo</b> é em quantas simulações a ação ficou sem folga e definiu a data final <span class="tec">(índice de criticidade)</span>; <b>peso da incerteza</b>, de 0 a 1, é o quanto a variação no prazo da ação mexe na data final <span class="tec">(crucialidade)</span>. Sozinha, a chance de ditar o prazo é o guia mais fraco: uma ação pode estar sempre no caminho e ter prazo muito previsível.</p>
    <div class="twrap"><table><thead><tr><th>Código</th><th>Ação</th><th class="n">Prioridade de atenção<span class="tec">SSI</span></th><th class="n">Chance de ditar o prazo<span class="tec">índice de criticidade</span></th><th class="n">Peso da incerteza<span class="tec">crucialidade</span></th><th class="n">Melhor / provável / pior</th><th class="n">Prazo calculado</th><th class="n">Folga</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

    const cls=x=>x==null?"":x>=.95?" ok":x>=.85?" warn":" crit";
    evPanel=`<div class="cols"><div class="panel"><span class="eyebrow">Quanto já devia estar feito × quanto foi feito</span>${svg}
      <p class="note">A linha cinza mostra quanto do trabalho deveria estar pronto em cada data, segundo o plano original. O ponto mostra quanto foi feito de fato. A linha tracejada indica em que data o plano previa chegar ao ponto atual: o tamanho dela é o atraso. <span class="tec">Termos técnicos: curva S, valor agregado e cronograma agregado (Earned Schedule).</span></p></div>
      <div class="panel"><span class="eyebrow">Situação em ${fdate(parseISO(P.statusDate))}</span>

}

  d:["duracao","dias","duracao (dias)","prazo","dias uteis"],owner:["responsavel","responsaveis","principais responsaveis","dono","owner","executor"],cost:["custo","orcamento","valor","custo previsto"],

function splitRow(line,sep){if(sep==="\t")return line.split("\t");const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else if(c==='"')q=true;else if(c===sep){out.push(cur);cur=""}else cur+=c}out.push(cur);return out}
function parseTable(txt){
  const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());if(!lines.length)return{rows:[],warns:["Nada para importar."]};
  const sep=lines[0].includes("\t")?"\t":(lines[0].split(";").length>lines[0].split(",").length?";":",");
  const hdr=splitRow(lines[0],sep).map(normKey);const map={};
  hdr.forEach((h,ci)=>{for(const k in SYN)if(map[k]==null&&SYN[k].includes(h)){map[k]=ci;return}});
  hdr.forEach((h,ci)=>{if(Object.values(map).includes(ci))return;for(const k in SYN)if(map[k]==null&&h.length>2&&SYN[k].some(s=>s.length>2&&h.startsWith(s))){map[k]=ci;return}});
  let body=lines.slice(1),warns=[];
  if(map.name==null&&map.id==null){Object.assign(map,{id:0,name:1,preds:2,o:3,m:4,p:5});body=lines;warns.push("Cabeçalho não reconhecido; li as colunas na ordem: código, ação, predecessores, O, M, P.")}
  const rows=[],batch=[];
  for(const l of body){const c=splitRow(l,sep).map(x=>x.trim());const g=k=>map[k]!=null?(c[map[k]]??""):undefined;
    let id=g("id"),name=g("name")??"";const label=(g("label")||"").trim();let desc=(g("desc")||"").trim();
    if(label){if(!desc&&name)desc=String(name).trim();name=label}
    if(!id){const mm=String(name).match(/^([A-Za-z0-9]{2,8})\s*[-–—:.)]\s*(.+)$/);if(mm){id=mm[1];name=mm[2]}}
    if(!id&&!name)continue;
    if(!id){const same=S.tasks.find(t=>normKey(t.name||"")===normKey(name));id=same?same.id:genCode(name,takenCodes(batch));if(!same)warns.push(`Código criado automaticamente para “${String(name).trim()}”: ${id}.`)}
    batch.push(id);
    id=String(id).trim().replace(/\s+/g,"_");
    if(!ID_RE.test(id)){warns.push(`Código inválido ignorado: “${id}”. Use letras, números, _ ou -.`);continue}
    const row={id,name:String(name).trim()};if(desc&&desc!==row.name)row.desc=desc;if(map.stage!=null)row.stage=(g("stage")||"").trim();
    if(map.preds!=null)row.preds=splitPreds(g("preds"));
    let o=num(g("o")),m=num(g("m")),p=num(g("p")),d=num(g("d"));
    if(m==null&&d!=null)m=d;if(o!=null)row.o=o;if(m!=null)row.m=m;if(p!=null)row.p=p;
    for(const k of["owner"])if(map[k]!=null)row[k]=g(k);
    for(const k of["cost","pct","ac"])if(map[k]!=null&&num(g(k))!=null)row[k]=num(g(k));
    for(const k of["aS","aF"])if(map[k]!=null&&brToISO(g(k)))row[k]=brToISO(g(k));
    rows.push(row)}
  return{rows,warns};
}
function cleanLabel(s){s=String(s||"").trim();s=s.replace(/^[\[\(\{>\/\\]+/,"").replace(/[\]\)\}\/\\]+$/,"").trim().replace(/^"(.*)"$/,"$1").replace(/<br\s*\/?>/gi," ").replace(/\s+/g," ").trim();return s}
function parseMermaid(txt){
  const nodes=new Map(),order=[],warns=[];
  const node=(id,label)=>{if(!nodes.has(id)){nodes.set(id,{id,name:"",preds:new Set()});order.push(id)}if(label){const n=nodes.get(id);let L=cleanLabel(label);const pre=new RegExp("^"+id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*[-–—:.)]\\s*");L=L.replace(pre,"");n.name=L}return nodes.get(id)};
  for(let raw of txt.replace(/\r/g,"").split(/\n|;(?=\s*(?:[A-Za-z0-9_\-]+\s*(?:-->|---|==>|-\.->|\[|\(|\{|$)))/)){
    let line=raw.replace(/%%.*$/,"").trim();if(!line)continue;
    if(/^(flowchart|graph)\b/i.test(line)||/^(classDef|class|style|linkStyle|click|direction|end|subgraph)\b/.test(line))continue;
    line=line.replace(/:::[\w-]+/g,"").replace(/\|[^|]*\|/g,"").replace(/--\s+[^->|]+?\s+-->/g,"-->").replace(/==\s+[^=>|]+?\s+==>/g,"==>").replace(/-\.\s+[^.]+?\s+\.->/g,"-.->");
    const segs=line.split(/\s*(?:<-->|-->|---|==>|===|-\.->|-\.-|--o|--x|~~~)\s*/);
    const parts=segs.map(sg=>sg.split(/\s+&\s+/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^([A-Za-z0-9_\-]+)\s*([\[\(\{>].*)?$/);if(!m){warns.push(`Trecho não reconhecido: “${x}”.`);return null}return node(m[1],m[2]).id}).filter(Boolean));
    for(let k=0;k+1<parts.length;k++)for(const a of parts[k])for(const b of parts[k+1])if(a!==b)nodes.get(b).preds.add(a);
  }
  const rows=order.map(id=>{const n=nodes.get(id);return{id,name:n.name||id,preds:[...n.preds]}});
  const bad=rows.filter(r=>!ID_RE.test(r.id));if(bad.length)warns.push("Alguns nós têm identificadores inválidos e foram ignorados.");
  if(rows.length)warns.push("O fluxograma traz as ações e as dependências, mas não os prazos. Depois de importar, preencha os prazos na aba Ações.");
  return{rows:rows.filter(r=>ID_RE.test(r.id)),warns};
}
